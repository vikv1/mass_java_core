plugins {
    id 'java'
}

group 'org.example'
version '1.0-SNAPSHOT'

sourceCompatibility = 1.8

repositories {
    mavenCentral()
}

dependencies {
    testCompile group: 'junit', name: 'junit', version: '4.12'

    compile files(System.getenv('MASS_JAR_PATH'))
}

jar {
    manifest {
        attributes(
                'Main-Class': 'edu.uw.bothell.css.dsl.mass.apps.ShortestPath.ShortestPath'
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    baseName 'app'
 }