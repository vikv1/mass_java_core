<!DOCTYPE html>
<html>
    <head>
        <title>UWCA</title>                 
        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>       
        <script src="js/index.js"></script>
        <link rel="stylesheet" href="css/index.css"/>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    </head>
    <body id="mainBody">
        <div id="headerDiv">  <h1>Welcome to University of Washington Climate Analysis</h1>
        </div>
        <div id="calcDiv">
            <div id="workFlow">
                <select multiple id="mgtParams" class="workflowSel">
                    <option>Param 2</option>
                </select>
                <select multiple id="inputParams" class="workflowSel">
                     <option>Model 1</option>
                     <option>Model 2</option>
                     <option>Model 3</option>
                </select>
                <select multiple id="mgtParams" class="workflowSel">
                     <option>ToE 1</option>
                     <option>ToE 2</option>
                     <option>ToE 3</option>
                </select>
            </div>
        </div>
        <div id="histDiv">
            <div id="statusDiv">
                <table id="statusTable">
                    <tr>
                        <th>Management Variable</th>
                        <th>Input Model</th>
                        <th>ToE Calculation</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                    <tr>
                        <td>Param 2</td>
                        <td>Model 1</td>
                        <td>ToE 1</td>
                        <td>Queued</td>
                        <td></td>
                    </tr>
                     <tr>
                        <td>Param 2</td>
                        <td>Model 2</td>
                        <td>ToE 2</td>
                        <td>In Progress</td>
                        <td></td>
                    </tr>
                     <tr>
                        <td>Param 2</td>
                        <td>Model 3</td>
                        <td>ToE 3</td>
                        <td>Completed</td>
                        <td><input type="button" value="Visualize"></td>
                    </tr>
                    
                </table>                
            </div>
        </div>
      
    </body>
</html>
